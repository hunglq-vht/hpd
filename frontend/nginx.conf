# Single origin for the browser: static app, the tile API and the NATS WebSocket.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css image/svg+xml;

  location /api/ {
    proxy_pass http://api:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # NATS WebSocket. In production terminate TLS here (wss://) and keep NATS on the private network.
  location = /nats {
    proxy_pass http://nats:8080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

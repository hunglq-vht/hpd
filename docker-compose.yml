name: drone-tracks

services:
  nats:
    image: nats:2.12-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats:/etc/nats:ro   # nats.conf includes auth.conf
    ports:
      - "4222:4222"   # NATS (backend services, benchmarks)
      - "8080:8080"   # NATS WebSocket (browsers; also proxied at /nats by the web container)
      - "8222:8222"   # monitoring
    restart: unless-stopped

  simulator:
    build: { context: ./backend, target: simulator }
    image: drone-tracks/simulator
    environment:
      NATS_URL: nats://backend:backend-secret@nats:4222
      TRACKS: ${TRACKS:-1000000}
      TICK_MS: ${TICK_MS:-1000}
      SEED: "42"
    depends_on: [nats]
    restart: unless-stopped

  api:
    build: { context: ./backend, target: api }
    image: drone-tracks/api
    environment:
      NATS_URL: nats://backend:backend-secret@nats:4222
      HTTP_ADDR: ":8090"
      PUBLIC_NATS_WS_PATH: /nats   # browsers connect to ws(s)://<page host>/nats
      VIEWER_USER: viewer
      VIEWER_PASS: viewer
      MAX_TOPICS: "256"
      DEFAULT_MARGIN: "0.5"
    ports:
      - "8090:8090"
    depends_on: [nats]
    restart: unless-stopped

  # u1-track-manager stand-in (`docker compose --profile u1 up -d nats nats-compressed u1sim`):
  # the resolve API on :8091 and JSON, batch and binary track messages through both WebSockets
  nats-compressed:
    profiles: [u1]
    image: nats:2.12-alpine
    command: ["-c", "/etc/nats/nats-compressed.conf"]
    environment:
      NATS_ROUTE: nats://nats:6222
    volumes:
      - ./nats:/etc/nats:ro
    ports:
      - "8081:8081"   # NATS WebSocket with compression
    depends_on: [nats]
    restart: unless-stopped

  u1sim:
    profiles: [u1]
    build: { context: ./backend, target: u1sim }
    image: drone-tracks/u1sim
    environment:
      NATS_URL: nats://backend:backend-secret@nats:4222
      FORMATS: ${FORMATS:-json,batch,binary}
      TICK_MS: ${TICK_MS:-1000}
      SEED: "42"
    ports:
      - "8091:8091"
    depends_on: [nats]
    restart: unless-stopped

  web:
    build: { context: ./frontend }
    image: drone-tracks/web
    ports:
      - "3000:80"
    depends_on: [api, nats]
    restart: unless-stopped

name: drone-tracks

services:
  nats:
    image: nats:2.12-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "4222:4222"   # NATS (backend services, benchmarks)
      - "8080:8080"   # NATS WebSocket (browsers; also proxied at /nats by the web container)
      - "8222:8222"   # monitoring
    restart: unless-stopped

  simulator:
    build: { context: ./backend, target: simulator }
    image: drone-tracks/simulator
    environment:
      NATS_URL: nats://backend:backend-secret@nats:4222
      TRACKS: ${TRACKS:-1000000}
      TICK_MS: ${TICK_MS:-1000}
      SEED: "42"
    depends_on: [nats]
    restart: unless-stopped

  api:
    build: { context: ./backend, target: api }
    image: drone-tracks/api
    environment:
      NATS_URL: nats://backend:backend-secret@nats:4222
      HTTP_ADDR: ":8090"
      PUBLIC_NATS_WS_PATH: /nats   # browsers connect to ws(s)://<page host>/nats
      VIEWER_USER: viewer
      VIEWER_PASS: viewer
      MAX_TOPICS: "256"
      DEFAULT_MARGIN: "0.5"
    ports:
      - "8090:8090"
    depends_on: [nats]
    restart: unless-stopped

  web:
    build: { context: ./frontend }
    image: drone-tracks/web
    ports:
      - "3000:80"
    depends_on: [api, nats]
    restart: unless-stopped

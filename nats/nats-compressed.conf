# Second NATS server for the u1 simulator: the same messages as nats.conf (it joins its cluster),
# but its WebSocket compresses what it sends (permessage-deflate), so a client can compare the two.
# NATS_ROUTE is the cluster address of the first server:
#   docker compose: nats://nats:6222 (set in docker-compose.yml)
#   local:          NATS_ROUTE=nats://127.0.0.1:6222 nats-server -c nats/nats-compressed.conf
port: 4223
http_port: 8223

max_payload: 1MB
max_pending: 64MB
write_deadline: "5s"
max_connections: 10000

websocket {
  port: 8081
  no_tls: true
  compression: true
}

cluster {
  name: drone-tracks
  port: 6223
  routes: [$NATS_ROUTE]
}

include ./auth.conf

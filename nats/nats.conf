# NATS server for the drone tracking demo.
port: 4222
http_port: 8222          # monitoring: /varz /connz /subsz

max_payload: 1MB         # a tile snapshot holds at most 65 000 records (~1 MB)
max_pending: 64MB        # per-connection outbound buffer before a client is a slow consumer
write_deadline: "5s"
max_connections: 10000

websocket {
  port: 8080
  no_tls: true           # demo only: terminate TLS (wss) at the proxy or enable it here in production
  compression: false     # binary snapshots compress poorly; saves CPU on both ends
}

# Lets nats-compressed.conf (a second WebSocket, with compression, for the u1 simulator) join as a
# second server, so a message published here also reaches its clients.
cluster {
  name: drone-tracks
  port: 6222
}

include ./auth.conf

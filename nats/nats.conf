# NATS server for the drone tracking demo.
port: 4222
http_port: 8222          # monitoring: /varz /connz /subsz

max_payload: 1MB         # a tile snapshot holds at most 65 000 records (~1 MB)
max_pending: 64MB        # per-connection outbound buffer before a client is a slow consumer
write_deadline: "5s"
max_connections: 10000

websocket {
  port: 8080
  no_tls: true           # demo only: terminate TLS (wss) at the proxy or enable it here in production
  compression: false     # binary snapshots compress poorly; saves CPU on both ends
}

authorization {
  users: [
    # producers and the tile monitor
    { user: backend, password: backend-secret, permissions: { publish: ">", subscribe: ">" } }
    # browsers: read-only access to the track tiles (demo and the local u1 mock), plus the clock
    # service via request/reply
    { user: viewer, password: viewer, permissions: {
        publish:   { allow: ["svc.time"] }
        subscribe: { allow: ["tracks.>", "u1.track.region.>", "_INBOX.>"] }
      }
    }
  ]
}

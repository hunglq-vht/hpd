# Users shared by nats.conf and nats-compressed.conf.
authorization {
  users: [
    # producers and the tile monitor
    { user: backend, password: backend-secret, permissions: { publish: ">", subscribe: ">" } }
    # browsers: read-only access to the track tiles (demo, the u1 mock and every u1sim format), plus
    # the clock service via request/reply
    { user: viewer, password: viewer, permissions: {
        publish:   { allow: ["svc.time"] }
        subscribe: { allow: ["tracks.>", "u1.track.>", "_INBOX.>"] }
      }
    }
  ]
}
